name: quality

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows 验证真实绿色包、Electron 进程所有权和 Python 退出清理。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: corepack enable
      - run: pnpm install --no-lockfile
      - run: uv sync --project backend --group dev
      - run: uv run --project backend pytest -q
      - name: Verify Electron-managed development Python (handshake/auth/shutdown)
        run: node scripts/smoke/managed-dev.mjs
      - run: pnpm test:scripts
      - name: Verify automatic uv download with no global uv
        run: node --test scripts/tests/uv-bootstrap.test.mjs
        env:
          UV_BOOTSTRAP_ONLINE: '1'
      - run: pnpm typecheck
      - run: pnpm exec electron-vite build
      - name: Ensure dev Electron binary is installed before packaging
        run: pnpm electron:setup
      - name: Smoke-test real development Electron auto-start of Python
        run: node scripts/smoke/electron-dev.mjs
      - run: pnpm build
      - name: Verify the selected Python is cached without downloads
        shell: pwsh
        run: |
          $version = (Get-Content backend/.python-version -Raw).Trim()
          $python = uv python find --managed-python --no-project --no-python-downloads $version
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $python)) {
            throw "The build did not reuse a persistent uv-managed Python installation"
          }
          Write-Output "Cached Python: $python"
      - name: Smoke-test packaged Python (HTTP / WebSocket / shutdown)
        run: node scripts/smoke/backend.mjs
      - name: Smoke-test packaged Electron launcher and process cleanup
        run: node scripts/smoke/electron.mjs
      - name: Check Python watchdog after forced Electron termination
        run: node scripts/smoke/parent-exit.mjs
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: WaferWaterDetector-windows-x64
          path: dist/win-unpacked/
          if-no-files-found: error
          compression-level: 3
      - name: Verify bundled Python
        shell: pwsh
        run: |
          $manifest = "dist/win-unpacked/resources/backend/manifest.json"
          if (!(Test-Path $manifest)) { throw "Backend manifest missing" }
          $config = Get-Content $manifest -Raw | ConvertFrom-Json
          $python = Join-Path "dist/win-unpacked/resources/backend" $config.python
          if (!(Test-Path $python)) { throw "Bundled Python missing: $python" }
          & $python -I -c "import sample_backend, water_detector, fastapi, uvicorn, loguru; print('Bundled runtime OK')"
          if ($LASTEXITCODE -ne 0) { throw "Bundled Python failed" }

  # Linux 只校验跨平台源码、Node 辅助工具和 Python 单测；不打 Windows 包。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: corepack enable
      - run: pnpm install --no-lockfile
      - run: uv sync --project backend --group dev
      - run: uv run --project backend pytest -q
      - name: Verify Electron-managed development Python (handshake/auth/shutdown)
        run: node scripts/smoke/managed-dev.mjs
      - run: pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm exec electron-vite build
