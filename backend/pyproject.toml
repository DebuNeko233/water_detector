[project]
name = "wafer-water-detector"
version = "0.2.0"
description = "Electron-managed wafer rinse inspection with unchanged OpenCV detection"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "loguru>=0.7,<1",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "python-multipart>=0.0.9",
]
[dependency-groups]
dev = ["httpx>=0.26", "pytest>=8,<10"]
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sample_backend", "src/water_detector"]
[tool.pytest.ini_options]
testpaths = ["tests"]
