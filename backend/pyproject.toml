[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-water-detector"
version = "0.1.0"
description = "Wafer rinse optical anomaly detection backend"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "opencv-python>=4.8", "fastapi>=0.110", "uvicorn>=0.27",
  "pydantic>=2.4", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]
